version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ner_landslideguard_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - API_V1_STR=/api/v1
      - PROJECT_NAME=NER-LandslideGuard
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
